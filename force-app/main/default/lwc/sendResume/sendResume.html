<template>
    <lightning-card title="Apply for Job 2 years" icon-name="custom:custom63">
        <div class="slds-var-p-around_medium">
            <lightning-input
                label="Recipient Email"
                value={email}
                onchange={handleEmailChange}
                required
            ></lightning-input>
            <div style="margin-top: 5px;">
            <lightning-button
                class="slds-float_right"
                label="Send Email"
                variant="brand"
                onclick={handleSendEmail}
            ></lightning-button>
            </div>
        </div>
    </lightning-card>
</template>
